name: Publish Arch extras packages

on:
  push:
    branches:
      - main
    paths:
      - '**/PKGBUILD'
      - '**/*.install'
      - '**/*.patch'
      - '**/*.desktop'
      - '**/*.service'
      - '**/*.timer'
      - '**/*.sysusers'
      - '**/*.tmpfiles'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: packages-extras-publish
  cancel-in-progress: false

env:
  REPO_NAME: argvus-extras
  PACKAGES_REPO: argvus/packages

jobs:
  discover:
    name: Discover PKGBUILDs
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.find.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find package directories
        id: find
        shell: bash
        run: |
          set -euo pipefail

          packages="$(find packages -name PKGBUILD -printf '%h\n' | sort | jq -R -s -c 'split("\n")[:-1]')"

          if [ "$packages" = "[]" ]; then
            echo "::error::No PKGBUILD files found under packages/"
            exit 1
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: discover
    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - name: Install base tooling
        run: |
          pacman -Syu --noconfirm --needed git sudo

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare makepkg user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        working-directory: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t package_deps < <(sudo -u builder bash -lc 'source PKGBUILD; printf "%s\n" "${depends[@]}" "${makedepends[@]}"')

          installable_deps=()
          for dep in "${package_deps[@]}"; do
            dep="${dep%%[<>=]*}"
            dep="${dep%%:*}"
            [ -n "$dep" ] || continue

            if pacman -Si "$dep" >/dev/null 2>&1; then
              installable_deps+=("$dep")
            else
              echo "Skipping dependency not found in enabled pacman repos: $dep"
            fi
          done

          if [ "${#installable_deps[@]}" -gt 0 ]; then
            pacman -S --noconfirm --needed "${installable_deps[@]}"
          fi

          sudo -u builder makepkg --nodeps --noconfirm --skippgpcheck

      - name: Collect package files
        id: collect
        shell: bash
        run: |
          set -euo pipefail

          safe_name="$(printf '%s' "${{ matrix.package }}" | tr '/[:space:]' '--')"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "${{ matrix.package }}" -maxdepth 1 -type f -name '*.pkg.tar.zst' -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

          echo "artifact_name=$safe_name" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ steps.collect.outputs.artifact_name }}
          path: artifacts/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish packages repository
    needs:
      - discover
      - build
    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel

    steps:
      - name: Install publishing tools
        run: |
          pacman -Syu --noconfirm --needed git gnupg pacman

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: built-packages
          merge-multiple: true

      - name: Clone packages repository
        env:
          PACKAGES_REPO_TOKEN: ${{ secrets.PACKAGES_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          [ -n "$PACKAGES_REPO_TOKEN" ] || { echo "::error::PACKAGES_REPO_TOKEN secret is not set"; exit 1; }
          git clone "https://x-access-token:${PACKAGES_REPO_TOKEN}@github.com/${PACKAGES_REPO}.git" packages-repo

      - name: Publish packages
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          arch="$(uname -m)"
          repo_dir="packages-repo/public/arch/extras/${arch}"

          mkdir -p "$repo_dir"
          find "$repo_dir" -maxdepth 1 -type f -name '*.old' -delete

          shopt -s nullglob
          built_packages=(built-packages/*.pkg.tar.zst)
          if [ "${#built_packages[@]}" -eq 0 ]; then
            echo "::error::No built package artifacts were downloaded"
            exit 1
          fi

          for built_package in "${built_packages[@]}"; do
            package_name="$(basename "$built_package")"
            target_package="$repo_dir/$package_name"

            if [ -e "$target_package" ]; then
              echo "Package already exists, keeping published file immutable: $package_name"
              continue
            fi

            cp -v "$built_package" "$target_package"
          done

          cd "$repo_dir"
          repo_packages=(./*.pkg.tar.zst)
          if [ "${#repo_packages[@]}" -eq 0 ]; then
            echo "::error::No package files found in $repo_dir"
            exit 1
          fi

          repo-add "${REPO_NAME}.db.tar.gz" "${repo_packages[@]}"
          rm -f "${REPO_NAME}.db" "${REPO_NAME}.files"
          cp -f "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.db"
          cp -f "${REPO_NAME}.files.tar.gz" "${REPO_NAME}.files"
          find . -maxdepth 1 -type f -name '*.old' -delete

          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            export GNUPGHOME
            GNUPGHOME="$(mktemp -d)"
            chmod 700 "$GNUPGHOME"

            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
            GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')"
            [ -n "$GPG_KEY_ID" ] || { echo "::error::No secret GPG key was imported"; exit 1; }

            gpg_sign() {
              local target="$1"
              rm -f "${target}.sig"

              if [ -n "${GPG_PASSPHRASE:-}" ]; then
                gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                  --local-user "$GPG_KEY_ID" --detach-sign "$target"
              else
                gpg --batch --yes --pinentry-mode loopback \
                  --local-user "$GPG_KEY_ID" --detach-sign "$target"
              fi
            }

            rm -f ./*.sig
            for package_file in ./*.pkg.tar.zst; do
              gpg_sign "$package_file"
            done
            gpg_sign "${REPO_NAME}.db.tar.gz"
            gpg_sign "${REPO_NAME}.files.tar.gz"
            gpg_sign "${REPO_NAME}.db"
            gpg_sign "${REPO_NAME}.files"
          else
            echo "GPG_PRIVATE_KEY is not set; publishing unsigned extras repository metadata."
          fi

      - name: Commit and push
        working-directory: packages-repo
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A public/arch/extras/

          if git diff --cached --quiet; then
            echo "No package changes to publish."
            exit 0
          fi

          git commit -m "Publish extras packages from argvus/argvus-extras@${GITHUB_SHA}"
          git push origin main
